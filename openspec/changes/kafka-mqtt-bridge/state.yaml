notes: |
  Proposal for the first bounded context in gardenia-bridge: `nodes`, a
  stateless Kafka<->MQTT relay for IoT node traffic (telemetry, heartbeat,
  command, command-ack), with a local SQLite audit log (edge-deployment
  friendly, independent of the main Postgres connection). No device registry,
  no business transport (GraphQL/REST/MCP), best-effort delivery, no node
  auth in v1 — all explicit decisions confirmed with the user before writing
  this proposal. Explicitly deviates from the template's standard
  aggregate/CQRS ceremony where it doesn't apply; design.md documents exactly
  what applies and what doesn't, since this is the precedent-setting first
  context for this service.

  Kafka topics: one topic per message type from the start (revised after
  user feedback) — gardenia-bridge.telemetry, .heartbeat, .command-acks
  (node→Kafka) and .commands (Kafka→node) — rather than a single shared
  topic discriminated by a `type` field. A single KafkaBridgeProducerService
  resolves the destination topic from envelope.type, so the application
  layer stays unaware of the topic split.

  SQLite persistence: confirmed with the user as TypeORM + a second
  `better-sqlite3`-backed DataSource (as originally proposed in design.md),
  after walking through the alternative (raw better-sqlite3, no ORM) — user
  chose to keep one consistent persistence tool across the project.

  Not yet implemented. Run `openspec-apply-change` (or ask to implement) to
  start working through tasks.md — the user has reviewed and confirmed both
  flagged decisions (SQLite approach, per-type Kafka topics).
