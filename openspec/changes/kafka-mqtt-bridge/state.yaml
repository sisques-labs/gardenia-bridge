notes: |
  Proposal for the first bounded context in gardenia-bridge: `nodes`, a
  stateless Kafka<->MQTT relay for IoT node traffic (telemetry, heartbeat,
  command, command-ack), with a local SQLite audit log (edge-deployment
  friendly, independent of the main Postgres connection). No device registry,
  no business transport (GraphQL/REST/MCP), best-effort delivery, no node
  auth in v1 — all explicit decisions confirmed with the user before writing
  this proposal. Explicitly deviates from the template's standard
  aggregate/CQRS ceremony where it doesn't apply; design.md documents exactly
  what applies and what doesn't, since this is the precedent-setting first
  context for this service.

  Not yet implemented. Run `openspec-apply-change` (or ask to implement) to
  start working through tasks.md once the user has reviewed and approved
  this proposal — particularly the SQLite-as-second-DataSource approach and
  the gardenia-bridge-owned Kafka topic prefix, both flagged as notable
  deviations/decisions in design.md.
